<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Add Print Job</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="/css/style.css"><link rel="icon" href="data:,"></head><body><nav class="navbar navbar-dark bg-primary"><div class="container"><a class="navbar-brand" href="/admin/dashboard.html">Add Print Job</a><a href="/admin/jobs.html" class="btn btn-light btn-sm">Back</a></div></nav><main class="container py-5"><div class="row justify-content-center"><div class="col-lg-7"><div class="card shadow"><div class="card-body"><form id="jobForm"><div class="mb-3"><label class="form-label">PDF</label><input type="file" id="file" accept="application/pdf,.pdf" class="form-control" required></div><div id="uploadStatus" class="mb-3"></div><div class="row"><div class="col-md-6 mb-3"><label class="form-label">Pages</label><input type="number" id="pages" min="1" class="form-control" readonly required></div><div class="col-md-6 mb-3"><label class="form-label">Copies</label><input type="number" id="copies" min="1" value="1" class="form-control" required></div></div><div class="mb-3"><label class="form-label">Print Type</label><select id="printType" class="form-select"><option>Black & White</option><option>Color</option></select></div><div class="mb-3"><label class="form-label">Payment Status</label><select id="paymentStatus" class="form-select"><option>PENDING</option><option>PAID</option></select></div><div class="mb-3"><label class="form-label">Amount</label><input id="amountDisplay" class="form-control" value="₹0" readonly></div><button class="btn btn-success">Upload & Create</button></form></div></div></div></div></main><script src="/js/config.js"></script><script src="/js/admin/add-job.js"></script></body></html>
