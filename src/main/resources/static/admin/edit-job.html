<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Edit Print Job</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="icon" href="data:," />
  </head>
  <body>
    <main class="container py-5">
      <div class="row justify-content-center">
        <div class="col-lg-7">
          <div class="card shadow">
            <div class="card-header bg-warning"><h3>Edit Print Job</h3></div>
            <div class="card-body">
              <form id="updateForm">
                <div class="mb-3">
                  <label class="form-label">File Name</label
                  ><input id="fileName" class="form-control" required />
                </div>
                <input id="filePath" type="hidden" />
                <div class="row">
                  <div class="col mb-3">
                    <label class="form-label">Pages</label
                    ><input
                      id="pages"
                      type="number"
                      min="1"
                      class="form-control"
                      required
                    />
                  </div>
                  <div class="col mb-3">
                    <label class="form-label">Copies</label
                    ><input
                      id="copies"
                      type="number"
                      min="1"
                      class="form-control"
                      required
                    />
                  </div>
                </div>
                <div class="mb-3">
                  <label class="form-label">Print Type</label
                  ><select id="printType" class="form-select">
                    <option>Black & White</option>
                    <option>Color</option>
                  </select>
                </div>
                <div class="mb-3">
                  <label class="form-label">Status</label
                  ><select id="status" class="form-select">
                    <option>PENDING</option>
                    <option>PRINTING</option>
                    <option>COMPLETED</option>
                    <option>CANCELLED</option>
                  </select>
                </div>
                <div class="mb-3">
                  <label class="form-label">Payment</label
                  ><select id="paymentStatus" class="form-select">
                    <option>PENDING</option>
                    <option>PAID</option>
                  </select>
                </div>
                <button class="btn btn-warning">Update</button
                ><a href="/admin/jobs.html" class="btn btn-secondary">Back</a>
              </form>
            </div>
          </div>
        </div>
      </div>
    </main>
    <script src="/js/config.js"></script>
    <script src="/js/admin/edit-job.js"></script>
  </body>
</html>
