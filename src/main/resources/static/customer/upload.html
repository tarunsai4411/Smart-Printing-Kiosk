<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Upload Document</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/style.css" />
    <link rel="icon" href="data:," />
  </head>
  <body>
    <nav class="navbar navbar-dark bg-primary">
      <div class="container">
        <a class="navbar-brand fw-bold" href="/customer/index.html"
          >🖨 Smart Printing Kiosk</a
        >
      </div>
    </nav>
    <main class="container py-5">
      <div class="row justify-content-center">
        <div class="col-lg-7">
          <div class="card shadow">
            <div class="card-header bg-primary text-white">
              <h3 class="mb-0">Upload Document</h3>
            </div>
            <div class="card-body">
              <form id="uploadForm">
                <div class="mb-3">
                  <label class="form-label">Choose PDF</label
                  ><input
                    type="file"
                    id="file"
                    class="form-control"
                    accept="application/pdf,.pdf"
                    required
                  />
                </div>
                <div class="row">
                  <div class="col-md-6 mb-3">
                    <label class="form-label">Pages</label
                    ><input
                      type="number"
                      id="pages"
                      class="form-control"
                      min="1"
                      value="1"
                      readonly
                    />
                  </div>
                  <div class="col-md-6 mb-3">
                    <label class="form-label">Copies</label
                    ><input
                      type="number"
                      id="copies"
                      class="form-control"
                      min="1"
                      value="1"
                      required
                    />
                  </div>
                </div>
                <div class="mb-3">
                  <label class="form-label">Print Type</label
                  ><select id="printType" class="form-select">
                    <option>Black & White</option>
                    <option>Color</option>
                  </select>
                </div>
                <h4 class="text-center my-4">
                  Amount: <span id="amount">₹2</span>
                </h4>
                <button type="submit" class="btn btn-success w-100">
                  Upload & Proceed to Payment
                </button>
                <div id="message" class="mt-3 text-center"></div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </main>
    <script src="/js/config.js"></script>
    <script src="/js/customer/upload.js"></script>
  </body>
</html>
