<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Payment</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="/css/style.css"><link rel="icon" href="data:,"></head><body><main class="container py-5"><div class="row justify-content-center"><div class="col-md-6"><div class="card shadow text-center"><div class="card-header bg-primary text-white"><h3 class="mb-0">Payment</h3></div><div class="card-body"><h3 id="amount">Amount: ₹0</h3><img src="/images/payment-qr.svg" alt="Payment QR" class="img-fluid my-3" style="max-width:240px" onerror="this.style.display='none'"><p>Scan using any UPI app, then confirm below.</p><button id="payBtn" class="btn btn-success btn-lg">Payment Successful</button><div id="message" class="mt-3"></div></div></div></div></div></main><div class="modal fade" id="receiptModal" tabindex="-1"><div class="modal-dialog"><div class="modal-content"><div class="modal-header bg-success text-white"><h5 class="modal-title">Payment Successful</h5></div><div class="modal-body"><p><strong>Queue:</strong> <span id="rQueue"></span></p><p><strong>File:</strong> <span id="rFile"></span></p><p><strong>Amount:</strong> ₹<span id="rAmount"></span></p><p><strong>Status:</strong> <span id="rStatus"></span></p></div></div></div></div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="/js/config.js"></script><script src="/js/customer/payment.js"></script></body></html>
