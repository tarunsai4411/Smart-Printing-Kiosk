<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Track Print Job</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        rel="stylesheet"
        href="/css/style.css">

    <link
        rel="icon"
        href="data:,">

</head>

<body class="bg-light">

    <!-- Navbar -->

    <nav class="navbar navbar-dark bg-primary">

        <div class="container">

            <a
                class="navbar-brand fw-bold"
                href="/customer/index.html">

                🖨 Smart Printing Kiosk

            </a>

            <a
                href="/customer/index.html"
                class="btn btn-light btn-sm">

                Home

            </a>

        </div>

    </nav>

    <main class="container py-5">

        <div class="row justify-content-center">

            <div class="col-lg-6">

                <!-- Manual Tracking -->

                <div
                    id="searchCard"
                    class="card shadow mb-4">

                    <div class="card-body">

                        <h4 class="text-center mb-3">
                            🔍 Track Print Job
                        </h4>

                        <p class="text-muted text-center">
                            Enter your Job ID to check the print status.
                        </p>

                        <div class="input-group">

                            <input
                                type="number"
                                id="jobIdInput"
                                class="form-control"
                                placeholder="Enter Job ID"
                                min="1">

                            <button
                                class="btn btn-primary"
                                type="button"
                                onclick="trackEnteredJob()">

                                Track

                            </button>

                        </div>

                        <div
                            id="message"
                            class="text-danger text-center mt-3">
                        </div>

                    </div>

                </div>

                <!-- Tracking Result -->

                <div
                    id="trackingCard"
                    class="card shadow text-center"
                    style="display: none;">

                    <div class="card-body p-4">

                        <h3 class="mb-4">
                            Print Job Status
                        </h3>

                        <h6>Queue Number</h6>

                        <h1
                            id="queueNo"
                            class="text-primary mb-4">
                            --
                        </h1>

                        <hr>

                        <h6>Job ID</h6>

                        <p
                            id="displayJobId"
                            class="fw-bold">
                            -
                        </p>

                        <h6>File</h6>

                        <p id="fileName">
                            -
                        </p>

                        <h6>Payment</h6>

                        <p
                            id="paymentStatus"
                            class="fw-bold">
                            -
                        </p>

                        <h6>Status</h6>

                        <h3
                            id="status"
                            class="text-warning">
                            PENDING
                        </h3>

                        <div class="mt-4">

                            <button
                                class="btn btn-primary me-2"
                                onclick="checkStatus()">

                                Refresh

                            </button>

                            <button
                                class="btn btn-outline-secondary"
                                onclick="trackAnotherJob()">

                                Track Another Job

                            </button>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </main>

    <script src="/js/config.js"></script>
    <script src="/js/customer/track.js"></script>

</body>

</html>
