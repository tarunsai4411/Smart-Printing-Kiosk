<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Track Print</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/style.css" />
    <link rel="icon" href="data:," />
  </head>
  <body>
    <nav class="navbar navbar-dark bg-primary">
      <div class="container">
        <a class="navbar-brand fw-bold" href="/customer/index.html"
          >🖨 Smart Printing Kiosk</a
        >
      </div>
    </nav>
    <main class="container py-5">
      <div class="row justify-content-center">
        <div class="col-lg-6">
          <div class="card shadow text-center p-4">
            <h3>Track My Print</h3>
            <h6>Queue Number</h6>
            <h1 id="queueNo" class="text-primary">--</h1>
            <hr />
            <h6>File</h6>
            <p id="fileName">-</p>
            <h6>Status</h6>
            <h3 id="status" class="text-warning">PENDING</h3>
            <button class="btn btn-primary" onclick="checkStatus()">
              Refresh
            </button>
          </div>
        </div>
      </div>
    </main>
    <script src="/js/config.js"></script>
    <script src="/js/customer/track.js"></script>
  </body>
</html>
